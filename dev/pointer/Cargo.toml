# Dev-only: moves and clicks the pointer through Hyprland's virtual-pointer
# protocol, for driving the GUI in tests. Use it via dev/click.sh, which checks
# focus and the window's bounds first. Kept out of the workspace (Wayland only).
[package]
name = "vpointer"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
