# Build, lint and test on Linux (the main target) and macOS (kept building).
name: CI
on:
  push:
  pull_request:
  # Run by hand from the Actions tab (e.g. to check macOS before a release).
  workflow_dispatch:

# A newer push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Headers for winit (Wayland/X11 keyboard handling), and glib's for
      # libwebrtc's glue (calls).
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libglib2.0-dev
      # libwebrtc for calls (dm-call), checked against its published SHA-256.
      - uses: actions/cache@v4
        with:
          path: .webrtc
          key: webrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dev/fetch-webrtc.sh') }}
      - run: dev/fetch-webrtc.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p darkmatter
      - uses: actions/upload-artifact@v4
        with:
          name: darkmatter-linux-x86_64
          path: target/release/darkmatter

  # Darkmatter's client against real Mattermost releases: the one our
  # group's server runs, and the newest. A Mattermost change that would
  # break Darkmatter fails here first.
  mattermost:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mattermost: ["11.7.12", "12.0.0"]
    services:
      mattermost:
        image: mattermost/mattermost-preview:${{ matrix.mattermost }}
        ports: ["8065:8065"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: for i in $(seq 1 120); do curl -sf http://127.0.0.1:8065/api/v4/system/ping && exit 0; sleep 2; done; exit 1
      - run: cargo test -p mm-api --locked --test mattermost
        env:
          MM_TEST_URL: http://127.0.0.1:8065

  # macOS minutes count ten times on a private repository, so this runs for
  # release tags and by hand, not every push.
  macos:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .webrtc
          key: webrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dev/fetch-webrtc.sh') }}
      - run: dev/fetch-webrtc.sh
      - run: cargo build --locked -p darkmatter
      - run: cargo test --workspace --locked
      # The encryption crate is shared with the phone apps (M4): it must
      # build for iPhone from the start.
      - run: rustup target add aarch64-apple-ios
      - run: cargo build --locked -p dm-crypto --target aarch64-apple-ios

  # And for Android, with the NDK the runner already has: the library and
  # its tests, linked. A warning only, until it has passed once.
  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: |
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - run: cargo test --locked -p dm-crypto --target aarch64-linux-android --no-run
