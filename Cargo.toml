[workspace]
resolver = "3"
members = ["crates/omarchy-theme", "crates/mm-api", "crates/darkmatter"]

[workspace.package]
edition = "2024"
version = "0.3.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"

# Smaller, faster release binary (`cargo build --release`): link-time
# optimization across crates and no debug symbols.
[profile.release]
lto = "thin"
strip = true
