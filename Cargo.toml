[workspace]
resolver = "3"
members = ["crates/omarchy-theme", "crates/mm-api", "crates/darkmatter", "crates/axiond", "crates/dm-crypto", "crates/dm-client", "crates/dm-call"]
# Experiments with their own dependencies (spikes/calls pulls in libwebrtc).
exclude = ["spikes"]

[workspace.package]
edition = "2024"
version = "0.5.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"

# LiveKit's WebRTC bindings with a frame transformer of ours (SFrame for
# calls), and str0m's ICE agent following a call's latest path:
# vendor/README.md says what changed.
[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
libwebrtc = { path = "vendor/libwebrtc" }
is = { path = "vendor/is" }

# Smaller, faster release binary (`cargo build --release`): link-time
# optimization across crates and no debug symbols.
[profile.release]
lto = "thin"
strip = true
