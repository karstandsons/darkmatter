[package]
name = "mm-client"
description = "Omarchy-themed Mattermost desktop client"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "mm-rust"
path = "src/main.rs"

[dependencies]
mm-api = { path = "../mm-api" }
omarchy-theme = { path = "../omarchy-theme" }
# No `web-colors`: it gamma-encodes theme colors twice, so #13141c rendered as #4b4d5c.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "thread-pool", "linux-theme-detection", "x11", "wayland", "tokio", "markdown", "image", "advanced"] }
tokio = { workspace = true, features = ["fs"] }
serde.workspace = true
tracing.workspace = true
toml = "1"
emojis = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
# iced pulls in `image` with no formats enabled; turn on what Mattermost serves.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
notify-rust = "4"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
wiremock = "0.6"
serde_json.workspace = true
tempfile = "3"
