[package]
name = "dm-call"
description = "Darkmatter's calls: microphone, speakers and media through axiond's SFU"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Google's WebRTC through LiveKit's bindings: echo cancellation, Opus,
# congestion control. The prebuilt archive is fetched and checked by
# dev/fetch-webrtc.sh (see .cargo/config.toml).
libwebrtc = "=0.3.53"
mm-api = { path = "../mm-api" }
# The camera: V4L2 on Linux, AVFoundation on macOS; MJPEG decoded.
nokhwa = { version = "0.10", features = ["input-native"] }
tokio = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sframe = "2.1.0"

# Screen sharing on Linux goes through the portal, over D-Bus with GLib.
[target.'cfg(target_os = "linux")'.dependencies]
libwebrtc = { version = "=0.3.53", features = ["glib-main-loop"] }

[dev-dependencies]
axiond = { path = "../axiond" }
# The call's keys come from dm-client, as in Darkmatter.
dm-client = { path = "../dm-client" }
dm-crypto = { path = "../dm-crypto" }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
