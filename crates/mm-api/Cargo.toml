[package]
name = "mm-api"
description = "Typed Mattermost API v4 REST + WebSocket client"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
reqwest = { version = "0.13", features = ["json", "multipart", "query"], optional = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
url = { version = "2", optional = true }
serde_path_to_error = { version = "0.1", optional = true }

[features]
default = ["client"]
# The REST and websocket client. Without it, only the models: what axiond
# uses, so the server and Darkmatter share one definition of every type.
client = ["dep:tokio", "dep:tracing", "dep:reqwest", "dep:tokio-tungstenite", "dep:futures-util", "dep:url", "dep:serde_path_to_error", "dep:thiserror"]

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["net"] }
# tests/mattermost.rs: a picture to upload.
image = { version = "0.25", default-features = false, features = ["png"] }
