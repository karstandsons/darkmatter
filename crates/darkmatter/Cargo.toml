[package]
name = "darkmatter"
description = "Omarchy-themed Mattermost desktop client"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "darkmatter"
path = "src/main.rs"

[dependencies]
mm-api = { path = "../mm-api" }
omarchy-theme = { path = "../omarchy-theme" }
# No `web-colors`: it gamma-encodes theme colors twice, so #13141c rendered as #4b4d5c.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "thread-pool", "linux-theme-detection", "x11", "wayland", "tokio", "markdown", "image", "advanced"] }
tokio = { workspace = true, features = ["fs", "process", "io-util", "time"] }
serde.workspace = true
tracing.workspace = true
toml = "1"
emojis = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
# iced pulls in `image` with no formats enabled; turn on what Mattermost serves.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
keyring = "4"
# The update check (GitHub's latest release); mm-api already pulls it in.
reqwest = { version = "0.13", features = ["json"] }
# The Update button: checking and unpacking a release tarball.
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
notify-rust = "4"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Pasting an image from the clipboard (Wayland's data-control, X11, macOS).
# Plugins talk JSON; `plugins add` stages in a temp folder.
serde_json.workspace = true
tempfile = "3"
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }

[dev-dependencies]
wiremock = "0.6"
