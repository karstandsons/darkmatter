[package]
name = "axiond"
description = "The Darkmatter chat server"
edition.workspace = true
version = "0.1.0"
# The server is copyleft; the shared crates and Darkmatter stay MIT OR Apache-2.0.
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
# Calls: the SFU. Pure-Rust crypto, so the static musl build stays simple.
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"] }
# End-to-end encryption: the server's checks (MLS delivery service).
dm-crypto = { path = "../dm-crypto" }
openmls_memory_storage = "0.6"
base64 = "0.22"
# Only the models: the same types Darkmatter reads, so the two can't drift.
mm-api = { path = "../mm-api", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal", "fs", "io-std", "io-util"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "query", "tokio", "ws"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "derive", "macros"] }
argon2 = "0.5"
sha2 = "0.11"
rand = "0.9"
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
toml = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
anyhow = "1"
tokio-util = { version = "0.7", features = ["io"] }
percent-encoding = "2"
# Two-factor login codes (RFC 6238).
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth"] }
# HTTPS: Let's Encrypt certificates, or your own files. ring, so the static
# musl build stays simple.
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots", "axum"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
# Its timer, for the header-read timeout.
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# Backups: a .tar.gz of the database snapshot and the stored files.
tar = "0.4"
flate2 = "1"
rustls-pki-types = { version = "1", features = ["std"] }
# Thumbnails and previews of uploaded pictures (never of encrypted files).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
rcgen = "0.14"
tokio = { workspace = true, features = ["process"] }
mm-api = { path = "../mm-api" }
# The client side of encryption, driven against a real axiond.
dm-client = { path = "../dm-client" }
openmls_memory_storage = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart"] }
tempfile = "3"
# Websockets sent as a misbehaving app would.
tokio-tungstenite = "0.30"
